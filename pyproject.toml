[project]
name = "accountable"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=40.54.0",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.environment]
python-version = "3.12"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
