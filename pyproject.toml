[project]
name = "accountable"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=40.54.0",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
